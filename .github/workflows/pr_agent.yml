name: PR-Agent AI Review & Fix
    
    on:
      pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
      issue_comment:
        types: [created]
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    jobs:
      pr_agent_job:
        # Don't run on bot comments/PRs to avoid infinite loops
        if: ${{ github.event.sender.type != 'Bot' }}
        runs-on: ubuntu-latest
        name: Run PR-Agent on PR or comment
        steps:
          - name: PR Agent action step
            id: pragent
            uses: the-pr-agent/pr-agent@main
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              CONFIG.MODEL: "gemini/gemini-2.0-flash"
              CONFIG.FALLBACK_MODELS: "['gemini/gemini-1.5-flash']"
              # PR reviewer settings
              PR_REVIEWER.REQUIRE_ALL_TESTS_PASS: "false"
              PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS_PER_CHUNK: 4
