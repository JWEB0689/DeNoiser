name: Release DeNoiser

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --onefile --name denoiser --add-data "filters/builtin.toml;filters" cli.py

    - name: Build with PyInstaller (Unix)
      if: matrix.os != 'windows-latest'
      run: pyinstaller --onefile --name denoiser --add-data "filters/builtin.toml:filters" cli.py

    - name: Rename binary for platform
      shell: bash
      run: |
        cd dist
        if [ "$RUNNER_OS" == "Windows" ]; then
          mv denoiser.exe denoiser-windows.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          mv denoiser denoiser-macos
        else
          mv denoiser denoiser-linux
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: denoiser-${{ matrix.os }}
        path: dist/denoiser-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
